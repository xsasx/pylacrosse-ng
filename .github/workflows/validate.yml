name: Validate project

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify project metadata
        run: |
          test -s README.md
          test -s COPYING
          test -f .github/FUNDING.yml
          grep -q "GNU LESSER GENERAL PUBLIC LICENSE" COPYING
          grep -q 'ko_fi: xsas1337' .github/FUNDING.yml
      - name: Install project and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run parser regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build distributable wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Verify installed public API in a clean virtual environment
        run: |
          python -m venv /tmp/pylacrosse-ng-smoke
          /tmp/pylacrosse-ng-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/pylacrosse-ng-smoke/bin/python -I -c '
          from importlib.metadata import version
          from pylacrosse_ng import (
              LaCrosseReading, LaCrosseReceiver, ReceiverHealth,
              SerialConnection, SerialConnectionError, parse_telegram,
          )
          assert version("pylacrosse-ng") == "0.1.0.dev0"
          reading = parse_telegram("OK 9 5 1 4 150 45")
          assert isinstance(reading, LaCrosseReading)
          assert reading.sensor_id == 5
          assert reading.humidity == 45
          print("Wheel installation and public API smoke test passed.")
          '
