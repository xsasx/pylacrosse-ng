name: Package preview (no publishing)

on:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"
      - "src/**"
      - "README.md"
      - "COPYING"
      - ".github/workflows/package-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-preview:
    name: Build and verify wheel/sdist
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install packaging tools
        run: python -m pip install --upgrade build twine

      - name: Build source and wheel distributions
        run: python -m build

      - name: Verify distribution metadata
        run: python -m twine check --strict dist/*

      - name: Check package and runtime versions match
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          import tomllib

          metadata = tomllib.loads(Path("pyproject.toml").read_text())
          version = metadata["project"]["version"]
          module = ast.parse(Path("src/pylacrosse_ng/__init__.py").read_text())
          declared = next(
              node.value.value
              for node in module.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "__version__"
                      for target in node.targets)
              and isinstance(node.value, ast.Constant)
          )
          assert version == declared, (
              f"pyproject version {version!r} does not match __version__ {declared!r}"
          )
          print(f"Package version consistent: {version}")
          PY

      - name: Install built wheel in isolated venv
        run: |
          python -m venv /tmp/pylacrosse-ng-wheel-check
          /tmp/pylacrosse-ng-wheel-check/bin/python -m pip install dist/*.whl
          /tmp/pylacrosse-ng-wheel-check/bin/python - <<'PY'
          from importlib.metadata import version
          from pylacrosse_ng import (
              LaCrosseReceiver,
              SensorRegistry,
              SerialConnection,
              TemperatureQualityRules,
              parse_telegram,
          )

          result = parse_telegram("OK 9 5 1 3 21 106")
          assert result is not None
          assert result.temperature == -21.1
          assert result.humidity is None
          print("Wheel installed and public imports work:", version("pylacrosse-ng"))
          PY

      - name: Upload build artifacts for manual inspection
        uses: actions/upload-artifact@v4
        with:
          name: pylacrosse-ng-package-preview
          path: dist/*
          if-no-files-found: error
          retention-days: 14
